name=AffaDisplay
version=0.3.1
author=Andrii <www.andruxa@gmail.com>
maintainer=Andrii <www.andruxa@gmail.com>
sentence=Non-blocking ESP32 driver for Renault AFFA2/AFFA3 OEM dash panels over CAN.
paragraph=Talks to Carminat and UpdateList dash panels: ISO-TP-ish transport, sync handshake, lazy function registration, menu rendering and key decoding. Nothing in the library blocks or sleeps - the CAN seam is a pull port and every transmit is a state machine advanced by poll(). Zero dynamic allocation after begin(). Host-testable with no hardware. Requires collin80/esp32_can and collin80/can_common unless you build with -D AFFA_ENABLE_ESP32CAN_LINK=0 and supply your own ICanLink.
category=Communication
url=https://github.com/andruxa/AffaDisplay
architectures=esp32
includes=AffaDisplay.h
depends=can_common

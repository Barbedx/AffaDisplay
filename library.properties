name=AffaDisplay
version=2.0.0
author=Andrii <www.andruxa@gmail.com>
maintainer=Andrii <www.andruxa@gmail.com>
sentence=Non-blocking ESP32 driver for Renault AFFA2/AFFA3 OEM dash panels over CAN.
paragraph=Talks to Carminat and UpdateList dash panels: ISO-TP-ish transport, sync handshake, function registration as part of the opening, screen rendering and key decoding. Nothing in the library blocks or sleeps - the CAN seam is a pull port and every transmit is a state machine advanced by poll(). Zero dynamic allocation after begin(). Host-testable with no hardware. TwaiLink runs on the ESP-IDF TWAI driver in the ESP32 Arduino core; no third-party CAN library is required. Implement ICanLink to supply your own driver.
category=Communication

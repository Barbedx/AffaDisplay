name=AffaDisplay
version=1.0.0
author=Andrii <www.andruxa@gmail.com>
maintainer=Andrii <www.andruxa@gmail.com>
sentence=Non-blocking ESP32 driver for Renault AFFA2/AFFA3 OEM dash panels over CAN.
paragraph=Talks to Carminat and UpdateList dash panels: ISO-TP-ish transport, sync handshake, function registration as part of the opening, menu rendering and key decoding. Nothing in the library blocks or sleeps - the CAN seam is a pull port and every transmit is a state machine advanced by poll(). Zero dynamic allocation after begin(). Host-testable with no hardware. Esp32CanLink uses the ESP32 Arduino core's built-in ESP-IDF TWAI driver directly; no third-party CAN library is required. Build with -D AFFA_ENABLE_ESP32CAN_LINK=0 to supply your own ICanLink.
category=Communication
url=https://github.com/Barbedx/AffaDisplay
architectures=esp32
includes=AffaDisplay.h

; AffaDisplay — the footprint harness. NOT part of `pio run`; it lives in its own file and
; its own build dir so that switching between it and platformio.ini never invalidates the
; main build cache.
;
;   pio run -c platformio_footprint.ini            every measurement env
;   pio run -c platformio_footprint.ini -e g_base  the reference build
;
; WHY IT EXISTS. The size_* envs in platformio.ini build examples/01_link_check, which names
; no panel class, so --gc-sections removes every panel and every optional builder before the
; linker is done — which is the right answer to "what does an unused panel cost" (zero) and
; the WRONG instrument for "what does this gate remove". tools/footprint/gate_probe instantiates
; all three panels and calls every optional render, so nothing can be collected away, and one
; flag flipped against g_base is that flag's real cost. The README "What each gate is
; actually worth" table is filled in from exactly these environments.
;
; g_neg_* MUST FAIL TO COMPILE. They are the guards in AffaConfig.h, exercised.
; b_* build no AffaDisplay source at all: they are the two baselines the footprint table
; quotes its deltas against.
[platformio]
src_dir = src
build_dir = .pio/gates

[common]
build_flags =
  -std=gnu++17
  -fno-exceptions
src_flags =
  -Wall
  -Wextra
  -Wundef
build_unflags =
  -std=gnu++11

[c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
  collin80/can_common
  https://github.com/collin80/esp32_can.git
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
build_src_filter = +<*> +<../tools/footprint/gate_probe/>

; ---- the reference build: all three panels, every feature on -------------------
[env:g_base]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1

; ---- panel gates ---------------------------------------------------------------
[env:g_no_carminat]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=0
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1

[env:g_no_updatelist]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=0
  -D AFFA_PANEL_UPDATELIST_MENU=0

[env:g_no_ul_menu]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=0

; ---- feature gates, all against g_base -----------------------------------------
[env:g_no_menu]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_MENU=0

[env:g_no_log]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_LOG=0

[env:g_no_translit]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_TRANSLITERATION=0

[env:g_no_popup]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_POPUP=0

[env:g_no_fullscreen]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_FULLSCREEN=0

[env:g_no_confirmbox]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_CONFIRMBOX=0

[env:g_no_infopopup]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_INFOPOPUP=0

[env:g_no_subs]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_MAX_SUBSCRIPTIONS=0

; ---- gates that are OFF in g_base: measure the ON cost --------------------------
[env:g_aux_on]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_AUX_TRACKER=1

[env:g_isotp_on]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_ISOTP_RX=1

[env:g_vpanel_on]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_VIRTUAL_PANEL=1

; ---- the esp32_can link gate ----------------------------------------------------
; g_base has it ON (ARDUINO default) and the probe uses it; here it is off, and the
; probe then references no driver symbol at all.
[env:g_no_esp32can]
extends = c3
lib_deps =
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_ESP32CAN_LINK=0

; ---- negative tests: these MUST fail to compile --------------------------------
[env:g_neg_typo]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINET=1        ; the typo the guard exists to catch

[env:g_neg_task]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_TASK=1

[env:g_pos_defaultall]
extends = c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_DEFAULT_ALL=1

; ---- footprint baselines (no AffaDisplay source at all) -------------------------
[env:b_empty]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = -std=gnu++17 -fno-exceptions
build_unflags = -std=gnu++11
build_src_filter = -<*> +<../tools/footprint/baseline_empty/>

[env:b_can]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
  collin80/can_common
  https://github.com/collin80/esp32_can.git
build_flags = -std=gnu++17 -fno-exceptions
build_unflags = -std=gnu++11
build_src_filter = -<*> +<../tools/footprint/baseline_can/>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-
      - run: pip install platformio
      - name: docs/WIRE.md matches the test vectors
        run: node tools/gen_wire_doc.js --check
      - name: example web pages parse
        run: node tools/check_web_ui.js
      - name: no side effects inside AFFA_LOG arguments
        run: node tools/check_log_args.js
      - name: host tests
        run: pio test -e native

  # The README's Install block and Minimal example, built as a user's project on every
  # platform the README says it was tested with. Any warning in the example fails the job.
  readme:
    name: README example on ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [espressif32@6.13.0, espressif32@8.0.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-readme-${{ matrix.platform }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-readme-${{ matrix.platform }}-
      - run: pip install platformio
      - name: build
        run: |
          set -o pipefail
          node tools/readme_consumer.js "$RUNNER_TEMP/consumer" "${{ matrix.platform }}"
          pio run -d "$RUNNER_TEMP/consumer" 2>&1 | tee build.log
      - name: no warnings from the example
        run: |
          if grep -E '^src/main\.cpp:[0-9]+:[0-9]+: warning:' build.log; then exit 1; fi
      - name: show the failure
        if: failure()
        run: |
          { grep -E 'error:|warning:' build.log | grep 'main\.cpp' | head -15; tail -15 build.log; } \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=README example::/'
          echo

  build:
    name: build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ex03_hello, ex04_sniffer, ex17_mediascreen, ex17_mediascreen_c3, ex18_aiscreen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install platformio
      - name: build
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee build.log
      # Only a warning whose location is in this repository's src/ or examples/ fails the job;
      # framework headers are not ours to fix.
      - name: no warnings from the library or the examples
        run: |
          if grep -E '^(src|examples)/[^:]+:[0-9]+:[0-9]+: warning:' build.log > own.txt; then
            cat own.txt
            while IFS= read -r l; do echo "::error file=${l%%:*}::${l#*warning: }"; done < own.txt
            exit 1
          fi
      # Job logs need a login to read; an annotation does not. Put the failure where a
      # reader without one can see it.
      - name: show the failure
        if: failure()
        run: |
          { grep -E 'error:|Error|\*\*\*' build.log | grep -v 'Werror' | head -15; tail -15 build.log; } \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=build tail::/'
          echo

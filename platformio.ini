; AffaDisplay — development project for the library itself.
;
; A consumer does NOT use this file: they add AffaDisplay to lib_deps and set the AFFA_*
; gates in their own build_flags. This file exists to build the example on the bench board
; and to compile the library for the host.
;
;   pio run -e native                 compile the library for the host (no hardware)
;   pio run -e ex01_bringup           build the bring-up example for the C3
;   pio run -e ex01_bringup -t upload first flash, over USB; thereafter http://<ip>/update

[platformio]
; The library's own src/ is the project source directory, so every env compiles the library
; from source and an example is added on top with build_src_filter.
src_dir = src

[common]
build_flags =
  -std=gnu++17
  -fno-exceptions
; Warnings go in build_src_flags, not build_flags: the Arduino core is not -Wundef clean and
; drowning our own diagnostics in thousands of CONFIG_IDF_TARGET_* lines is how a real one
; gets missed.
src_flags =
  -Wall
  -Wextra
  -Wundef                ; catches an AFFA_* gate misspelled INSIDE the library: every gate
                         ; is always #define'd, so an undefined one in an #if is a typo.
build_unflags =
  -std=gnu++11           ; the C3 Arduino core still defaults to gnu++11

; ---------------------------------------------------------------------------
; Host build — the portability check. src/rtos/ is deliberately absent here: it is the one
; part of the library that is not portable, and AffaConfig.h #errors if you ask for it.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  ${common.build_flags}
  ${common.src_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_MENU=1
  -D AFFA_ENABLE_ESP32CAN_LINK=0   ; the header needs <driver/gpio.h>, which the host does
                                   ; not have; host code drives LoopbackLink instead
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=5
build_unflags = ${common.build_unflags}
test_framework = unity
test_build_src = yes     ; the library IS the code under test, so link src/ into the tests
; A test build gets its main() from the suite; a plain `pio run` of this env would have none.
; tools/host_main.cpp supplies one, gated on !UNIT_TEST.
build_src_filter = +<*> +<../tools/host_main.cpp>

; ---------------------------------------------------------------------------
; Target: the bench board (ESP32-C3 SuperMini + transceiver, rx=GPIO4 tx=GPIO3)
; ---------------------------------------------------------------------------
[esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; PINNED, and it must stay pinned: with a bare URL a clean build takes whatever master is
; that day, and the driver contract this library is written against changes under it.
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}

; ---------------------------------------------------------------------------
; THE ONE TO FLASH. Prove we hear the panel, then prove we can write to it — with WiFi and
; ElegantOTA brought up first so the board can always be reached again.
;
; The library surface is deliberately minimal: no menu, no marquee. Scrolling and animation
; are application policy or an opt-in widget, never something the protocol layer does for
; you, and this example does none of it.
; ---------------------------------------------------------------------------
[env:ex01_bringup]
extends = esp32c3
; SAFETY: the native-USB C3 drops large images mid-write above this.
upload_speed = 115200
monitor_speed = 115200
; SAFETY: two 1.4 MB OTA slots. The default table's 1.25 MB app slot does not hold this
; image plus WiFi plus the web UI, and a single-slot table makes a bad flash unrecoverable
; on a board with no cable and no buttons.
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  ; The library owns the poll task. This is what makes the example hard to break: loop() can
  ; block for as long as it likes and the protocol keeps running.
  -D AFFA_ENABLE_TASK=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_MARQUEE=0
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=4
  ; SAFETY: without these the C3's native USB CDC never enumerates and the only diagnostic
  ; channel left is the network you are trying to bring up.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/01_bringup/>

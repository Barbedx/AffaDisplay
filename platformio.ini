; AffaDisplay — development project for the library itself.
;
; A consumer does not use this file: they add AffaDisplay to lib_deps and set the AFFA_*
; gates in their own build_flags. This file builds the examples and the host tests.
;
;   pio test -e native                    host tests (no hardware)
;   pio run -e ex17_mediascreen           build the console example for an ESP32 DevKit
;   pio run -e ex17_mediascreen -t upload first flash over USB; after that, http://<ip>/update

[platformio]
; The library's own src/ is the project source directory, so every env compiles the library
; from source and an example is added on top with build_src_filter.
src_dir = src

[common]
build_flags =
  -std=gnu++17
  -fno-exceptions
; Warnings go in build_src_flags, not build_flags, so they apply to this repository's code only.
src_flags =
  -Wall
  -Wextra
; -Wundef catches a misspelled AFFA_* gate: every gate is always #define'd, so an undefined
; one in an #if is a typo. Host build only: the ESP32 framework headers are not -Wundef clean
; and print about 1200 warnings that are not ours.
native_flags =
  -Wundef
build_unflags =
  -std=gnu++11           ; the C3 Arduino core still defaults to gnu++11

; ---------------------------------------------------------------------------
; Host build: the library without the ESP32 parts (src/rtos/, TwaiLink), driven through
; LoopbackLink by the tests.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  ${common.build_flags}
  ${common.src_flags}
  ${common.native_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  ; The cluster has no hardware and no example; this is the only build that compiles it.
  -D AFFA_PANEL_CLUSTER=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=5
build_unflags = ${common.build_unflags}
test_framework = unity
test_build_src = yes     ; the library IS the code under test, so link src/ into the tests
; A test build gets its main() from the suite; a plain `pio run` of this env would have none.
; tools/host_main.cpp supplies one, gated on !UNIT_TEST.
build_src_filter = +<*> +<../tools/host_main.cpp>

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini + transceiver, CRX on GPIO3, CTX on GPIO4.
;
; Every ESP32 env pins espressif32@6.13.0 (Arduino core 2.0.17). The PsychicHttp examples do
; not build on 8.0.0; the library itself does. Example dependencies are pinned too.
; ---------------------------------------------------------------------------
[esp32c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}

; ---------------------------------------------------------------------------
; The smallest program: power on, "SUCCESS", the clock. No WiFi and no OTA, so it is flashed
; over USB. Built here for the C3; on another board change AFFA_CAN_RX / AFFA_CAN_TX.
; ---------------------------------------------------------------------------

[env:ex03_hello]
extends = esp32c3
upload_speed = 115200
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_TASK=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D AFFA_CAN_RX=3
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/03_hello/>

; ---------------------------------------------------------------------------
; A listen-only sniffer through <AffaTwai.h>. No AFFA_PANEL_* flag on purpose: this env
; checks that the library builds without one.
; ---------------------------------------------------------------------------
[env:ex04_sniffer]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
build_flags =
  ${common.build_flags}
build_src_filter = +<*> +<../examples/04_sniffer/>

; ---------------------------------------------------------------------------
; The web console: every render, a frame log, key capture and a self-check. Flash this first
; on new hardware. It logs a soak line to /api/log once a minute.
; ---------------------------------------------------------------------------
[env:ex17_mediascreen]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
lib_deps =
  hoeken/PsychicHttp@1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#e2c2aee15e9f71ed35415cc02f0b10b53b2c195c   ; the psychic-http branch
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  ; The library polls from its own task; the HTTP handlers call the display from theirs.
  -D AFFA_ENABLE_TASK=1
  -D AFFA_ENABLE_NAV=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=3
  -D ELEGANTOTA_USE_PSYCHIC=1
  -D AFFA_CAN_RX=5
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/17_mediascreen/>

; ---------------------------------------------------------------------------
; 17_mediascreen on the ESP32-C3 SuperMini, CRX on GPIO3, CTX on GPIO4. A separate env
; because a DevKit image does not boot on a C3: flashing the wrong one over OTA means
; recovering over USB.
; ---------------------------------------------------------------------------
[env:ex17_mediascreen_c3]
extends = esp32c3
upload_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  hoeken/PsychicHttp@1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#e2c2aee15e9f71ed35415cc02f0b10b53b2c195c   ; the psychic-http branch
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_ENABLE_TASK=1
  -D AFFA_ENABLE_NAV=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=3
  ; Serial over the C3's native USB.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
  -D AFFA_CAN_RX=3
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/17_mediascreen/>

; ---------------------------------------------------------------------------
; Shows screens pushed by any producer (HTTP, an LLM, Home Assistant). A producer composes
; screens, never AffaDisplay commands; examples/18_aiscreen/DisplayDocument.h is the format.
; With no producer, a built-in deck rotates.
; ---------------------------------------------------------------------------
[env:ex18_aiscreen]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
lib_deps =
  hoeken/PsychicHttp@1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#e2c2aee15e9f71ed35415cc02f0b10b53b2c195c   ; the psychic-http branch
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_TASK=1
  -D AFFA_ENABLE_NAV=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=3
  -D ELEGANTOTA_USE_PSYCHIC=1
  -D AFFA_CAN_RX=5
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/18_aiscreen/>

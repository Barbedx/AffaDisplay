; AffaDisplay — development project for the library itself.
;
; A consumer does NOT use this file: they add AffaDisplay to lib_deps and set the
; AFFA_* gates in their own build_flags. This file exists to build the examples on the
; bench board and to run the host test suite.
;
;   pio test -e native          run the host tests (no hardware)
;   pio run                     build EVERY environment below: the host test env plus
;                               all 22 ESP32-C3 targets (23 envs total). Expected to be clean.
;   pio run -e ex01_link_check  build the link bring-up example for the C3
;   pio run -e size_min         the Carminat-only minimal build, for the flash table

[platformio]
; The library's own src/ is the project source directory, so every env compiles the
; library from source and an example is added on top with build_src_filter.
src_dir = src

[common]
build_flags =
  -std=gnu++17
  -fno-exceptions
; Warnings go in build_src_flags, not build_flags: the Arduino core is not -Wundef clean
; and drowning our own diagnostics in thousands of CONFIG_IDF_TARGET_* lines is how a
; real one gets missed.
src_flags =
  -Wall
  -Wextra
  -Wundef                ; catches an AFFA_* gate misspelled INSIDE the library: every gate
                         ; is always #define'd, so an undefined one in an #if is a typo.
                         ; It cannot catch a misspelling in a CONSUMER's build_flags —
                         ; -D AFFA_PANEL_CARMINET=1 defines a macro nothing reads, so there
                         ; is no undefined macro to diagnose. That case is caught instead by
                         ; the "no panel selected" #error in AffaConfig.h.
build_unflags =
  -std=gnu++11           ; the C3 Arduino core still defaults to gnu++11

; ---------------------------------------------------------------------------
; Host tests
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  ${common.build_flags}
  ${common.src_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  ; The menu widget is OFF by default (AffaConfig.h explains why it is a widget and not
  ; protocol). The suites that cover it opt in here, exactly as an application would.
  -D AFFA_ENABLE_MENU=1
  -D AFFA_ENABLE_ESP32CAN_LINK=0   ; the header needs <driver/gpio.h>, which the host
                                   ; does not have; tests drive LoopbackLink instead
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=5
build_unflags = ${common.build_unflags}
test_framework = unity
test_build_src = yes     ; the library IS the code under test, so link src/ into the tests
; A test build gets its main() from the suite; a plain `pio run` of this env would have
; none and used to fail with `undefined reference to WinMain`. tools/host_main.cpp supplies
; one, gated on !UNIT_TEST, so `pio run` with no -e builds every environment in this file.
build_src_filter = +<*> +<../tools/host_main.cpp>

; ---------------------------------------------------------------------------
; Target: the bench board (ESP32-C3 SuperMini + transceiver, rx=GPIO4 tx=GPIO3)
; ---------------------------------------------------------------------------
[esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; PINNED, and it must stay pinned. docs/ESP32CAN-CONTRACT.md is a file:line reading of
; exactly this commit (0.3.1+sha.c329e6b, committed 2026-07-09); with a bare URL a clean
; build takes whatever master is that day and every citation in that document rots
; silently. Bumping it means re-verifying the document — its own rule 21.
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}

[env:ex01_link_check]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=4
build_src_filter = +<*> +<../examples/01_link_check/>

[env:ex02_carminat_text]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/02_carminat_text/>

[env:ex03_carminat_menu]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=1
build_src_filter = +<*> +<../examples/03_carminat_menu/>

[env:ex04_updatelist_segment]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/04_updatelist_segment/>

[env:ex05_updatelist_menu]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST_MENU=1
build_src_filter = +<*> +<../examples/05_updatelist_menu/>

; The responsiveness demo. Menu off: the point here is the transmit queue, not the UI.
; Rebuild it with -D AFFA_TX_COALESCE=0 to see the defect the coalescing exists to remove.
[env:ex06_counter_preempt]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/06_counter_preempt/>

; The seam test: the password sequence, AUX detection and a custom menu gesture, all in
; application code. Needs the menu (for clearMenuHotkey/nav) and the subscription table.
[env:ex08_radio_mitm]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=1
  -D AFFA_MAX_SUBSCRIPTIONS=4
build_src_filter = +<*> +<../examples/08_radio_mitm/>

; The display-agnostic menu: ONE affa::widget::MenuModel driven onto three different
; displays (2x26 menu screen, 3x8 info rows, a 6x20 serial "OLED") through three renderers.
; Needs the menu gate for src/widget/, and the Carminat panel for two of the three adapters
; — the third touches no AFFA protocol at all, which is the point.
[env:ex09_menu_widget]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=1
build_src_filter = +<*> +<../examples/09_menu_widget/>

; The callback model, minimally: onKey, onText and a once-a-second render. Carries
; AFFA_ENABLE_ISOTP_RX because onText is the one callback that costs a gate.
[env:ex10_callbacks]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_ISOTP_RX=1
build_src_filter = +<*> +<../examples/10_callbacks/>

; Three rows scrolling on three different clocks, on a panel that never had a marquee.
; No menu: this drives showMenu directly, which is the panel primitive the widget sits on.
[env:ex11_mediascreen]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/11_mediascreen/>

; The SAME screen on the fullscreen primitive (0x21 mode 0x05) instead of showMenu, so the
; two can be compared on one panel. Three equal lines, no row tags, 14 frames not 13.
[env:ex12_fullscreen_media]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/12_fullscreen_media/>

; A running text row on the UpdateList LCD (AFFA2). Different panel family from every
; Carminat example above: 0x3DF sync, 0x121 data, 0x81 filler.
[env:ex13_updatelist_text]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/13_updatelist_text/>

; The SAME UpdateList running text, plus WiFi and OTA. This is the one to FLASH on the
; bench board: 192.168.100.85 has no serial cable and no buttons, so a firmware without a
; network on it cannot be replaced. ex13 is the example to read; this is the one to run.
[env:ex14_updatelist_bench]
extends = esp32c3
upload_speed = 115200
monitor_speed = 115200
; SAFETY: two 1.4 MB OTA slots. A single-slot table makes a bad flash unrecoverable.
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=4
  ; SAFETY: without these the C3's native USB CDC never enumerates and the only diagnostic
  ; channel left is the network you are trying to bring up.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/14_updatelist_bench/>

; The three AFFA2 display modes — NORMAL, FULLSCREEN and MENU — driven from a web UI.
; The mode is the LOCATION byte, not the panel class; see the file header.
[env:ex15_updatelist_modes]
extends = esp32c3
upload_speed = 115200
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_MARQUEE=0
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/15_updatelist_modes/>

; ---------------------------------------------------------------------------
; The three sibling web examples: the SAME two operations — text and clock — on all three
; panel families, each with WiFi, a web UI and ElegantOTA. What differs between them is
; only what the family can actually do, which is the point of having three.
;
;   ex16  Carminat     setText ✅   setTime ✅
;   ex17  UpdateList   setText ✅   no clock command exists in the family
;   ex18  cluster      setText ❌ unknown encoding   clock: raw 3EF, never run
;
; All three carry the two-slot OTA table for the same reason ex90 does: a board with no
; serial cable and no buttons must always keep a way back in.
; ---------------------------------------------------------------------------
[env:ex16_carminat_web]
extends = esp32c3
upload_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=4
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/16_carminat_web/>

[env:ex17_updatelist_web]
extends = esp32c3
upload_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=4
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/17_updatelist_web/>

; The one env that asks for the cluster profile and puts it on a bus. NOTHING in it is
; bench-verified; cluster_compile below still exists as the pure build check.
[env:ex18_cluster_web]
extends = esp32c3
upload_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CLUSTER=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_MARQUEE=0
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=4
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/18_cluster_web/>

; The interactive web console. This is the ONLY env that carries WiFi, and it is the one
; that must never be allowed to brick the board: 192.168.100.85 has no serial cable and no
; buttons, so OTA is the only way back in. Everything below marked SAFETY is load-bearing.
;
;   pio run -e ex90_bench_ota          build (this is what the size table quotes)
;   pio run -e ex90_bench_ota -t upload   FIRST flash only, over USB
;   thereafter: http://<ip>/update      ElegantOTA
[env:ex90_bench_ota]
extends = esp32c3
; SAFETY: the native-USB C3 drops large images mid-write above this on a car rig.
upload_speed = 115200
monitor_speed = 115200
; SAFETY: two 1.4 MB OTA slots, verbatim from MegaOpen/partitions_ota.csv. The default
; table's 1.25 MB app slot does not hold this image plus WiFi plus the web UI, and a
; single-slot table makes a bad flash unrecoverable without a cable.
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  ; The console is the APPLICATION, so it is the thing that opts into the menu widget.
  ; With this line removed the console still builds and every render endpoint still works
  ; — /api/nav returns NotSupported and the menu panel is inert, which is exactly what an
  ; application that brings its own menu should see.
  -D AFFA_ENABLE_MENU=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=5
  ; The reassembler and screen decoder, so /api/screen can report what the panel is being
  ; shown. The console decodes its OWN transmissions through the Layer-0 tap; with no panel
  ; attached, setSelfAck() supplies the ACKs the panel would.
  -D AFFA_ENABLE_ISOTP_RX=1
  ; SAFETY: without these the C3's native USB CDC never enumerates and the only diagnostic
  ; channel left is the network you are trying to bring up.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/90_bench_ota/>

; ---------------------------------------------------------------------------
; Footprint reference builds. `pio run -e size_all|size_carminat|size_min` and read
; the RAM/Flash lines; the README table is filled in from exactly these three.
; ---------------------------------------------------------------------------
[env:size_all]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_DEFAULT_ALL=1     ; the ONE env that deliberately asks for every panel
build_src_filter = +<*> +<../examples/01_link_check/>

[env:size_carminat]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
build_src_filter = +<*> +<../examples/01_link_check/>

[env:size_min]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_POPUP=0
  -D AFFA_ENABLE_FULLSCREEN=0
  -D AFFA_ENABLE_CONFIRMBOX=0
  -D AFFA_ENABLE_INFOPOPUP=0
  -D AFFA_ENABLE_TRANSLITERATION=0
  -D AFFA_ENABLE_LOG=0
  -D AFFA_MAX_SUBSCRIPTIONS=0
build_src_filter = +<*> +<../examples/01_link_check/>

; The dashboard-cluster profile, transcribed from one capture and NEVER run against
; hardware. Builds only; it exists to prove a third family costs a header of data.
[env:cluster_compile]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CLUSTER=1
build_src_filter = +<*> +<../examples/01_link_check/>

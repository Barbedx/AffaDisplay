; AffaDisplay — development project for the library itself.
;
; A consumer does NOT use this file: they add AffaDisplay to lib_deps and set the AFFA_*
; gates in their own build_flags. This file exists to build the example on the bench board
; and to compile the library for the host.
;
;   pio run -e native                 compile the library for the host (no hardware)
;   pio run -e ex01_bringup           build the bring-up example for the C3
;   pio run -e ex01_bringup -t upload first flash, over USB; thereafter http://<ip>/update

[platformio]
; The library's own src/ is the project source directory, so every env compiles the library
; from source and an example is added on top with build_src_filter.
src_dir = src

[common]
build_flags =
  -std=gnu++17
  -fno-exceptions
; Warnings go in build_src_flags, not build_flags: the Arduino core is not -Wundef clean and
; drowning our own diagnostics in thousands of CONFIG_IDF_TARGET_* lines is how a real one
; gets missed.
src_flags =
  -Wall
  -Wextra
  -Wundef                ; catches an AFFA_* gate misspelled INSIDE the library: every gate
                         ; is always #define'd, so an undefined one in an #if is a typo.
build_unflags =
  -std=gnu++11           ; the C3 Arduino core still defaults to gnu++11

; ---------------------------------------------------------------------------
; Host build — the portability check. src/rtos/ is deliberately absent here: it is the one
; part of the library that is not portable, and AffaConfig.h #errors if you ask for it.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  ${common.build_flags}
  ${common.src_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  ; THE CLUSTER IS COMPILED HERE AND NOWHERE ELSE, and that is the point. It is the one
  ; family with no hardware, so nothing exercised it -- and it silently stopped compiling
  ; through the whole 2.0 refactor because no build touched it. A panel nobody builds is a
  ; panel that rots.
  -D AFFA_PANEL_CLUSTER=1
                                   ; not have; host code drives LoopbackLink instead
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=5
build_unflags = ${common.build_unflags}
test_framework = unity
test_build_src = yes     ; the library IS the code under test, so link src/ into the tests
; A test build gets its main() from the suite; a plain `pio run` of this env would have none.
; tools/host_main.cpp supplies one, gated on !UNIT_TEST.
build_src_filter = +<*> +<../tools/host_main.cpp>

; ---------------------------------------------------------------------------
; Target: the bench board (ESP32-C3 SuperMini + transceiver, rx=GPIO3 tx=GPIO4)
; ---------------------------------------------------------------------------
[esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}

; ---------------------------------------------------------------------------
; THE ONE TO FLASH. Prove we hear the panel, then prove we can write to it — with WiFi and
; ElegantOTA brought up first so the board can always be reached again.
;
; The library surface is deliberately minimal: no menu, no marquee. Scrolling and animation
; are application policy or an opt-in widget, never something the protocol layer does for
; you, and this example does none of it.
; ---------------------------------------------------------------------------

[env:ex03_hello]
extends = esp32c3
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
upload_speed = 115200
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  -D AFFA_ENABLE_CANCOMMON_LINK=1
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_TASK=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<../examples/03_hello/>

; ---------------------------------------------------------------------------
; THE OPENING WITH NOTHING AROUND IT: one file, one page, the Carminat handshake and the
; clock, driven entirely from the CAN receive callback. No WiFi, no OTA, no HTTP, no library
; FSM — the library is compiled for its CONSTANTS and no display object is ever built.
;
; It exists to answer "what does the panel need to hear, and when?" without the queue, the
; ISO-TP transport, the ACK timeouts and the recovery FSM in the way. Every frame it sends is
; an answer to one the panel sent; the announce (BA) is the one exception and it is off by
; default, toggled from the serial console and stored in NVS.
;
; AFFA_ENABLE_TASK is 0 and AFFA_ENABLE_CANCOMMON_LINK is absent on purpose: there is no
; protocol object here to own a task, and the example drives CAN0 itself rather than through
; the library's seam.
; ---------------------------------------------------------------------------
[env:ex20_carminat_fsm_c3]
extends = esp32c3
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
upload_speed = 115200
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_TASK=0
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D AFFA_CAN_RX=3
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/20_carminat_fsm/>

[env:ex20_carminat_fsm_devkit]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_TASK=0
  -D AFFA_CAN_RX=5
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/20_carminat_fsm/>

; ---------------------------------------------------------------------------
; The LIVE SCREEN example: three scrolling rows at three speeds, a popup on a timer, and a
; console to change any of it without a rebuild. This is the one to leave running for hours
; — it reports a soak line into /api/log once a minute.
;
[env:ex17_mediascreen]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
; The standard collin80 CAN stack, same as 09..16.
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  ; THE LIBRARY OWNS THE POLL TASK. This console calls the display from its HTTP handlers,
  ; which before 2.0 raced loop()'s poll() on the transmit queue (docs/REFACTOR-2.0.md §1.2).
  ; The cross-task boundary in enqueue() makes that correct, and this is the build that
  ; exercises it on real glass.
  -D AFFA_ENABLE_TASK=1
  -D AFFA_ENABLE_CANCOMMON_LINK=1
  -D AFFA_ENABLE_NAV=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=3
  -D ELEGANTOTA_USE_PSYCHIC=1
  -D AFFA_CAN_RX=5
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/17_mediascreen/>

; ---------------------------------------------------------------------------
; 17_mediascreen on the ESP32-C3 SuperMini — CRX -> GPIO3, CTX -> GPIO4.
;
; SAME SOURCE, DIFFERENT SILICON, and the env exists because the two cannot share one: the
; C3 is RISC-V and the DevKit is Xtensa, so an image built above will not boot here at all.
; Over OTA that costs a cable, because a board that does not boot does not serve /update.
;
; The pins are NOT the DevKit's rx=5 — this module is soldered the other way round, and the
; pin pair is the thing to check first when a board that flashed cleanly hears nothing.
; ---------------------------------------------------------------------------
[env:ex17_mediascreen_c3]
extends = esp32c3
upload_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_ENABLE_TASK=1
  -D AFFA_ENABLE_CANCOMMON_LINK=1
  -D AFFA_ENABLE_NAV=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=3
  ; The C3 talks over native USB-CDC; these mean nothing on a DevKit's CP2102 and are the
  ; difference between a serial monitor and silence.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
  ; CRX -> GPIO3, CTX -> GPIO4, as soldered, and SETTLED: with these the board completed the
  ; handshake, reached registered and passed all four self-check steps. What made it look
  ; wrong for a session was an intermittent open on the CRX line, which re-made itself while
  ; the board was being probed. A pull-down alone cannot see that — the module holds its own
  ; D input up with a protective resistor, so GPIO4 reads 100 whoever is driving.
  ; MeganeCAN's setCANPins(GPIO_NUM_4, GPIO_NUM_3) is a DIFFERENT board: same module,
  ; opposite soldering. Not evidence about this one, either way.
  -D AFFA_CAN_RX=3
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/17_mediascreen/>

; ---------------------------------------------------------------------------
; THE BRING-UP RIG: two ESP32s, one bus, no panel and no protocol.
;
; Every diagnosis on this bench used to be made through the AffaDisplay protocol, on a bus
; with a panel on it, with an intermittent contact underneath — three variables at once, which
; is why the answers kept flipping. These two envs are the same program on the two boards, and
; the only thing under test is named in the URL.
;
; Flash BOTH. One board alone runs mode=selftest and answers "is something wrong with this
; ESP"; the pair runs pingpong and answers everything else.
;
; A panel flag is required only because AffaConfig.h refuses to compile without one — this
; example never builds a panel object. AFFA_ENABLE_TASK is off for the same reason it matters:
; there is no protocol FSM here to own a task.
; ---------------------------------------------------------------------------
[env:ex19_cantest_c3]
extends = esp32c3
upload_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_CANCOMMON_LINK=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
  -D AFFA_CAN_RX=3
  -D AFFA_CAN_TX=4
  -D AFFA_CANTEST_NODE=0                 ; AP AffaCanA, mDNS affacana, default role A
build_src_filter = +<*> +<../examples/19_cantest/>

[env:ex19_cantest_devkit]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_CANCOMMON_LINK=1
  -D ELEGANTOTA_USE_PSYCHIC=1
  -D AFFA_CAN_RX=5
  -D AFFA_CAN_TX=4
  -D AFFA_CANTEST_NODE=1                 ; AP AffaCanB, mDNS affacanb, default role B
build_src_filter = +<*> +<../examples/19_cantest/>

; ---------------------------------------------------------------------------
; A CONTENT FEED, from anything that can compose a document — an LLM, a weather
; service, Home Assistant, curl. The device never learns which.
;
; The rule the whole example exists to enforce: a producer may compose SCREENS, a
; producer may never compose AffaDisplay commands. examples/18_aiscreen/DisplayDocument.h
; is the contract and the ONE place intent becomes protocol.
;
; It works with no server at all — a built-in deck rotates from the first second, which is
; not a demo mode but the design: a car goes into tunnels.
; ---------------------------------------------------------------------------
[env:ex18_aiscreen]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}
lib_deps =
  collin80/can_common@0.4.0
  https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_TASK=1
  -D AFFA_ENABLE_CANCOMMON_LINK=1
  -D AFFA_ENABLE_NAV=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=3
  -D ELEGANTOTA_USE_PSYCHIC=1
  -D AFFA_CAN_RX=5
  -D AFFA_CAN_TX=4
build_src_filter = +<*> +<../examples/18_aiscreen/>

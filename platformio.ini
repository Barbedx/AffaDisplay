; AffaDisplay — development project for the library itself.
;
; A consumer does NOT use this file: they add AffaDisplay to lib_deps and set the
; AFFA_* gates in their own build_flags. This file exists to build the examples on the
; bench board and to run the host test suite.
;
;   pio test -e native          run the host tests (no hardware)
;   pio run                     build EVERY environment below: the host link check plus
;                               all 12 ESP32-C3 targets. Expected to be clean.
;   pio run -e ex01_link_check  build the link bring-up example for the C3
;   pio run -e size_min         the Carminat-only minimal build, for the flash table

[platformio]
; The library's own src/ is the project source directory, so every env compiles the
; library from source and an example is added on top with build_src_filter.
src_dir = src

[common]
build_flags =
  -std=gnu++17
  -fno-exceptions
; Warnings go in build_src_flags, not build_flags: the Arduino core is not -Wundef clean
; and drowning our own diagnostics in thousands of CONFIG_IDF_TARGET_* lines is how a
; real one gets missed.
src_flags =
  -Wall
  -Wextra
  -Wundef                ; turns a misspelled AFFA_* gate into a diagnostic. Every gate
                         ; is always #define'd, so an undefined one in an #if is a typo.
build_unflags =
  -std=gnu++11           ; the C3 Arduino core still defaults to gnu++11

; ---------------------------------------------------------------------------
; Host tests
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  ${common.build_flags}
  ${common.src_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_PANEL_UPDATELIST_MENU=1
  -D AFFA_ENABLE_ESP32CAN_LINK=0   ; the header needs <driver/gpio.h>, which the host
                                   ; does not have; tests drive LoopbackLink instead
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=5
build_unflags = ${common.build_unflags}
test_framework = unity
test_build_src = yes     ; the library IS the code under test, so link src/ into the tests
; A test build gets its main() from the suite; a plain `pio run` of this env would have
; none and used to fail with `undefined reference to WinMain`. tools/host_main.cpp supplies
; one, gated on !UNIT_TEST, so `pio run` with no -e builds every environment in this file.
build_src_filter = +<*> +<../tools/host_main.cpp>

; ---------------------------------------------------------------------------
; Target: the bench board (ESP32-C3 SuperMini + transceiver, rx=GPIO4 tx=GPIO3)
; ---------------------------------------------------------------------------
[esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  collin80/can_common
  https://github.com/collin80/esp32_can.git
build_unflags = ${common.build_unflags}
build_src_flags = ${common.src_flags}

[env:ex01_link_check]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=4
build_src_filter = +<*> +<../examples/01_link_check/>

[env:ex02_carminat_text]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/02_carminat_text/>

[env:ex03_carminat_menu]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=1
build_src_filter = +<*> +<../examples/03_carminat_menu/>

[env:ex04_updatelist_segment]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/04_updatelist_segment/>

[env:ex05_updatelist_menu]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_UPDATELIST_MENU=1
build_src_filter = +<*> +<../examples/05_updatelist_menu/>

; The responsiveness demo. Menu off: the point here is the transmit queue, not the UI.
; Rebuild it with -D AFFA_TX_COALESCE=0 to see the defect the coalescing exists to remove.
[env:ex06_counter_preempt]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
build_src_filter = +<*> +<../examples/06_counter_preempt/>

; The panel twins, on the host: the whole library driven against a model of the panel with
; no CAN controller. `pio run -e ex07_virtual_panel -t exec` builds AND runs it.
[env:ex07_virtual_panel]
platform = native
build_flags =
  ${common.build_flags}
  ${common.src_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_ESP32CAN_LINK=0   ; the header needs <driver/gpio.h>, absent on the host
  -D AFFA_ENABLE_VIRTUAL_PANEL=1
  -D AFFA_ENABLE_LOG=0
build_unflags = ${common.build_unflags}
build_src_filter = +<*> +<../examples/07_virtual_panel/>

; The SAME example, unchanged, for the C3 with the twin gate ON. It exists to prove that
; proto/ and vpanel/ compile for the target — not because you would ship a panel model to
; a board that has a panel attached.
[env:ex07_virtual_panel_c3]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_VIRTUAL_PANEL=1
  -D AFFA_ENABLE_LOG=0
build_src_filter = +<*> +<../examples/07_virtual_panel/>

; The seam test: the password sequence, AUX detection and a custom menu gesture, all in
; application code. Needs the menu (for clearMenuHotkey/nav) and the subscription table.
[env:ex08_radio_mitm]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=1
  -D AFFA_MAX_SUBSCRIPTIONS=4
build_src_filter = +<*> +<../examples/08_radio_mitm/>

; The interactive web console. This is the ONLY env that carries WiFi, and it is the one
; that must never be allowed to brick the board: 192.168.100.85 has no serial cable and no
; buttons, so OTA is the only way back in. Everything below marked SAFETY is load-bearing.
;
;   pio run -e ex90_bench_ota          build (this is what the size table quotes)
;   pio run -e ex90_bench_ota -t upload   FIRST flash only, over USB
;   thereafter: http://<ip>/update      ElegantOTA
[env:ex90_bench_ota]
extends = esp32c3
; SAFETY: the native-USB C3 drops large images mid-write above this on a car rig.
upload_speed = 115200
monitor_speed = 115200
; SAFETY: two 1.4 MB OTA slots, verbatim from MegaOpen/partitions_ota.csv. The default
; table's 1.25 MB app slot does not hold this image plus WiFi plus the web UI, and a
; single-slot table makes a bad flash unrecoverable without a cable.
board_build.partitions = partitions_ota.csv
lib_deps =
  collin80/can_common
  https://github.com/collin80/esp32_can.git
  hoeken/PsychicHttp@^1.2.1
  https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_LOG=1
  -D AFFA_LOG_LEVEL=5
  ; The twin, so /api/screen can report what the panel is being shown and the whole
  ; console works with no transceiver and no panel attached. Pulls AFFA_ENABLE_ISOTP_RX in.
  -D AFFA_ENABLE_VIRTUAL_PANEL=1
  ; SAFETY: without these the C3's native USB CDC never enumerates and the only diagnostic
  ; channel left is the network you are trying to bring up.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELEGANTOTA_USE_PSYCHIC=1
build_src_filter = +<*> +<../examples/90_bench_ota/>

; ---------------------------------------------------------------------------
; Footprint reference builds. `pio run -e size_all|size_carminat|size_min` and read
; the RAM/Flash lines; the README table is filled in from exactly these three.
; ---------------------------------------------------------------------------
[env:size_all]
extends = esp32c3
build_flags = ${common.build_flags}
build_src_filter = +<*> +<../examples/01_link_check/>

[env:size_carminat]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
build_src_filter = +<*> +<../examples/01_link_check/>

[env:size_min]
extends = esp32c3
build_flags =
  ${common.build_flags}
  -D AFFA_PANEL_CARMINAT=1
  -D AFFA_ENABLE_MENU=0
  -D AFFA_ENABLE_POPUP=0
  -D AFFA_ENABLE_FULLSCREEN=0
  -D AFFA_ENABLE_CONFIRMBOX=0
  -D AFFA_ENABLE_INFOPOPUP=0
  -D AFFA_ENABLE_AUX_TRACKER=0
  -D AFFA_ENABLE_TRANSLITERATION=0
  -D AFFA_ENABLE_LOG=0
  -D AFFA_MAX_SUBSCRIPTIONS=0
build_src_filter = +<*> +<../examples/01_link_check/>
